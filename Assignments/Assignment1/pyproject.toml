[project]
name = "myproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KUSHAGRA GUPTA", email = "aakg2310@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipywidgets>=8.1.9",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "tqdm[notebook]>=4.70.0",
]

[project.scripts]
myproject = "myproject:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "notebook>=7.6.2",
]
